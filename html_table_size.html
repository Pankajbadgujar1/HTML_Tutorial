<!DOCTYPE html>

<html>
    <head>

        <title>HTML table Sizes</title>
        <style>
            table, th,td {
                border: 1px solid black;
                border-collapse: collapse;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1> HTML tables can have different sizes for each column, row or the entire table.</h1>

        <h2>To set the size of a specific column, add the style attribute on a <th> or <td> element:</h2>

        <table style="width: 50%;">
            <tr>
                <th style = "width: 70%;">First name</th>
                <th>Last name</th>

            </tr>
            <tr>
                <td>Pankaj </td>
                <td>Badgujar</td>
            </tr>

            <tr>
                <td>chetan</td>
                <td>yevale</td>
            </tr>
        </table>
  
        

    </body>
</html>
