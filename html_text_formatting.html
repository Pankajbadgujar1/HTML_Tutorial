<!DOCTYPE html>

<html>
    <head>

        <title>HTML Text Formatting</title>
  
    </head>
    <body>
      <h1>HTML contains several elements for defining text with a special meaning.</h1>
      
      <h2>
        HTML Formatting Element</h2>
        <p>
            <b> - Bold text <br>
                <strong> - Important text <br>
                <i> - Italic text <br>
                <em> - Emphasized text <br>
                <mark> - Marked text <br>
                <small> - Smaller text<br>
                <del> - Deleted text<br>
                <ins> - Inserted text<br>
                <sub> - Subscript text<br>
                <sup> - Superscript text<br>
        </p>

  
        

    </body>
</html>
